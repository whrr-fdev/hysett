background {
    monitor =
    path = /home/whrr/Pictures/Wallpapers/рукиASCII.png
    blur_passes = 2
    blur_size = 7
}

# ТЕКСТ С ИМЕНЕМ ПОЛЬЗОВАТЕЛЯ (СВЕРХУ)
label {
    monitor =
    text = whrr
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrainsMono NF
    position = 0, 50
    halign = center
    valign = center
}

# ПОЛЕ ВВОДА ПАРОЛЯ
input-field {
    monitor =
    size = 210, 40 # Уменьшили размер самого поля
    outline_thickness = 1 # Сделали границу тоньше и аккуратнее
    dots_size = 0.22
    dots_spacing = 0.25
    dots_fade_time = 200 # Плавные точки при вводе
    fade_on_empty = false
    
    # Цвета: делаем поле почти прозрачным графитовым, а границу четкой серой
    outer_color = rgba(170, 170, 170, 0.5)
    inner_color = rgba(20, 20, 20, 0.3) # Почти прозрачный фон (0.3)
    font_color = rgb(255, 255, 255)
    
    # Убрали теги <i></i>, теперь текст обычный, не курсивный, и чуть меньше размером
    placeholder_text = pa$$word...
    
    # Цвет обводки при ошибке или фокусе
    fail_color = rgb(204, 34, 34)
    check_color = rgb(170, 170, 170)
    
    position = 0, -10
    halign = center
    valign = center
}
